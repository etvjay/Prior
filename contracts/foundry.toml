[profile.default]
src = "src"
out = "forge-out"
test = "test"
script = "script"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true
bytecode_hash = "none"
cbor_metadata = false

[fmt]
line_length = 110
tab_width = 2
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "thousands"
